<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<title>Volt Runner</title>
<script src="leaderboards.js"></script>
<style>
  @font-face { font-family:"Press Start 2P"; src:url(fonts/press-start-2p-latin-400-normal.woff2) format("woff2"); font-weight:400; }
  @font-face { font-family:Inter; src:url(fonts/inter-latin-500-normal.woff2) format("woff2"); font-weight:500; }
  @font-face { font-family:Inter; src:url(fonts/inter-latin-700-normal.woff2) format("woff2"); font-weight:700; }
  :root { --bg:#0d1220; --panel:#161d31; --line:#26304d; --ink:#e8ecf7; --dim:#8a94b3; --volt:#ffd43b; --accent:#4dd4ff; --good:#3ddc84; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  #app { height:100dvh; display:flex; flex-direction:column; max-width:620px; margin:0 auto; gap:8px;
    padding: max(10px, env(safe-area-inset-top), var(--safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right), var(--safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left), var(--safe-area-inset-left, 0px)); }
  .hud { display:flex; align-items:center; gap:6px; }
  .title { font-family:"Press Start 2P",monospace; font-size:10px; line-height:1.4; color:var(--volt); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font:700 13px Inter,sans-serif; cursor:pointer; white-space:nowrap; }
  .btn:active { transform:translateY(1px); background:#1e2742; }
  .stats { display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:6px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 10px; display:flex; flex-direction:column; gap:3px; min-width:0; }
  .stat small { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
  .stat b { font-family:"Press Start 2P",monospace; font-size:12px; }
  .stat b.low { color:#ff6b6b; }
  #inv { display:flex; gap:4px; align-items:center; min-height:16px; flex-wrap:nowrap; overflow:hidden; }
  #inv span { width:16px; height:16px; border-radius:4px; display:inline-grid; place-items:center; font:700 10px Inter; color:#0d1220; }
  #stage { flex:1; min-height:0; position:relative; display:grid; place-items:center; touch-action:none; }
  canvas#cv { border-radius:12px; box-shadow:0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.45); touch-action:none; }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,52px); gap:8px; justify-content:center; }
  .pad button { background:var(--panel); border:1px solid var(--line); border-radius:14px; color:var(--ink); font-size:22px; touch-action:none; cursor:pointer; }
  .pad button.on { background:#24305a; border-color:var(--accent); }
  .pad .u { grid-column:2; grid-row:1; } .pad .l { grid-column:1; grid-row:2; } .pad .d { grid-column:2; grid-row:2; } .pad .r { grid-column:3; grid-row:2; }
  .pad .m { grid-column:3; grid-row:1; font:700 12px Inter; color:var(--accent); }
  .pad .lb { grid-column:1; grid-row:1; font-size:18px; }
  .overlay { position:absolute; inset:0; display:none; place-items:center; background:rgba(8,11,20,.94); border-radius:12px; z-index:5; padding:14px; }
  .overlay.show { display:grid; }
  .card { text-align:center; width:100%; max-width:400px; max-height:100%; overflow-y:auto; display:flex; flex-direction:column; gap:12px; align-items:center; padding:4px; overscroll-behavior:contain; touch-action:pan-y; }
  .card h1 { font-family:"Press Start 2P",monospace; font-size:20px; line-height:1.4; margin:0; color:var(--volt); text-shadow:0 0 18px rgba(255,212,59,.45); }
  .card h2 { font-family:"Press Start 2P",monospace; font-size:13px; line-height:1.6; margin:0; }
  .card p { margin:0; color:var(--dim); line-height:1.5; font-size:14px; }
  .card .go { background:var(--volt); color:#1a1400; border:none; border-radius:12px; padding:12px 22px; font:700 15px Inter; cursor:pointer; }
  .card .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .levels { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:100%; }
  .levels button { aspect-ratio:1; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:700 14px Inter; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:2px; }
  .levels button small { font-size:9px; color:var(--dim); font-weight:500; }
  .levels button.done { border-color:var(--good); }
  .levels button.done small { color:var(--good); }
  .levels button:disabled { opacity:.3; cursor:default; }
  .tier { width:100%; text-align:left; font:700 11px Inter; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
  .toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:rgba(22,29,49,.95); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; color:var(--ink); max-width:92%; text-align:center; pointer-events:none; opacity:0; transition:opacity .3s; z-index:4; }
  .toast.show { opacity:1; }
  .board { width:100%; border-collapse:collapse; font-size:14px; }
  .board td { padding:7px 6px; border-bottom:1px solid var(--line); text-align:left; }
  .board td:first-child { width:34px; color:var(--dim); font-weight:700; }
  .board td:last-child { text-align:right; font-family:"Press Start 2P",monospace; font-size:11px; }
  .board tr.me td { color:var(--volt); }
  .tabs { display:flex; gap:6px; }
  .tabs button.on { border-color:var(--volt); color:var(--volt); }
  .lvlnav { display:flex; align-items:center; gap:10px; }
  .lvlnav b { font-family:"Press Start 2P",monospace; font-size:11px; min-width:130px; }
  input.nick { background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:9px 10px; font:500 14px Inter; width:170px; user-select:text; -webkit-user-select:text; }
  #mapCv { image-rendering:pixelated; border-radius:8px; max-width:100%; }
  @media (min-width:700px) and (hover:hover) { .pad .u, .pad .d, .pad .l, .pad .r { display:none; } .pad { grid-template-rows:52px; } }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="title" id="lvlName">VOLT RUNNER</div>
    <button class="btn" id="soundBtn" aria-label="Toggle sound">🔊</button>
    <button class="btn" id="restartBtn">↻</button>
    <button class="btn" id="menuBtn">Levels</button>
  </div>
  <div class="stats">
    <div class="stat"><small>Cells left</small><b id="cellsOut">0</b></div>
    <div class="stat"><small>Time</small><b id="timeOut">0</b></div>
    <div class="stat"><small>Items</small><div id="inv"></div></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="ov"><div class="card" id="ovCard"></div></div>
  </div>
  <div class="pad" id="pad">
    <button class="lb" id="lbBtn" aria-label="Leaderboard">🏆</button>
    <button class="u" data-d="0,-1" aria-label="Up">▲</button>
    <button class="m" id="mapBtn">MAP</button>
    <button class="l" data-d="-1,0" aria-label="Left">◀</button>
    <button class="d" data-d="0,1" aria-label="Down">▼</button>
    <button class="r" data-d="1,0" aria-label="Right">▶</button>
  </div>
</div>
<script>
// ===== Volt Runner core rules (shared by game + solver) =====
const LEVELS = [
  { name: "Power Up", time: 90,
    hint: "Grab every power cell, then the socket opens to the exit portal.",
    map: [
      "###########",
      "#@...#...c#",
      "#.##.#.##.#",
      "#.#c.....##",
      "#.####.#..#",
      "#c...#.#.c#",
      "######S####",
      "  #...E.#  ",
      "  #######  "] },
  { name: "Lock & Key", time: 120,
    hint: "Keys open doors of the same color. Each key works once.",
    map: [
      "#############",
      "#@..#...#..y#",
      "#...R...B...#",
      "#.cr#..b#c..#",
      "#########Y###",
      "#c..........#",
      "#..######S###",
      "#.c#    #.E.#",
      "####    #####"] },
  { name: "Elements", time: 120,
    hint: "Water and lava are deadly. Swim fins and fire boots get you across, but only once: they're used up when you step back onto dry ground.",
    map: [
      "###########",
      "#@..w..llc#",
      "#.h.w.f.l.#",
      "#...w...l.#",
      "#.###.###.#",
      "#c###c###.#",
      "#########S#",
      "        #E#"] },
  { name: "Heavy Lifting", time: 150,
    hint: "Push crates into water to build a bridge. Stuck? Hit restart.",
    map: [
      "#############",
      "#@.....#ww.c#",
      "#..x...xww..#",
      "#c.....#ww..#",
      "##########S##",
      "         #E# "] },
  { name: "Slippery", time: 120,
    hint: "Ice keeps you sliding until you hit something solid.",
    map: [
      "###########",
      "#@..iiii.c#",
      "#.#.iiii.##",
      "#c..iiii..#",
      "#.##iiii#.#",
      "#...iiiic.#",
      "#########S#",
      "        #E#"] },
  { name: "Patrol", time: 120,
    hint: "Drones patrol back and forth. Touch one and you're toast. Time your moves!",
    map: [
      "#############",
      "#@.........c#",
      "#e..........#",
      "#.c.........#",
      "#..........e#",
      "#c....c....c#",
      "######S######",
      "     #E#     "] },
  { name: "Gauntlet", time: 180,
    hint: "Everything at once. Keys, crates, drones and water.",
    map: [
      "###############",
      "#@.r#..h..#.w.#",
      "#...R..x..B.wc#",
      "#.c.#.....#.w.#",
      "#####.e...#.w.#",
      "#c..w...b.#.wc#",
      "#############S#",
      "            #E#"] },
  { name: "Meltdown", time: 180,
    hint: "Find the boots, find the key, and watch your step on the ice.",
    map: [
      "#############",
      "#@..l.y#c...#",
      "#.f.l..Y.iii#",
      "#...l..#.iii#",
      "######.###.c#",
      "#c..wx...#..#",
      "##########S##",
      "         #E# "] },
  { name: "Crossfire", time: 200,
    hint: "Two drones guard the halls. Patience pays.",
    map: [
      "###############",
      "#@...#c...v...#",
      "#.x..#.###.##.#",
      "#....B.#c....r#",
      "#w####.#.####.#",
      "#.b..#e......c#",
      "#c...#####R####",
      "#....#  #.S.#  ",
      "######  #.E.#  ",
      "        #####  "] },
];

const KEYS = { r: "R", b: "B", y: "Y" };
const PORTAL_CH = "1234";
const isHazard = t => t === "w" || t === "l";
// Bumpers deflect a slide 90 degrees: "/" and "\"
function deflect(t, dx, dy) { return t === "/" ? [-dy, -dx] : [dy, dx]; }

function loadLevel(i) { return loadLevelFrom(LEVELS[i]); }
function loadLevelFrom(L) {
  const h = L.map.length;
  const w = Math.max(...L.map.map(r => r.length));
  const grid = [];
  const enemies = [];
  const ports = {};
  let px = 0, py = 0, cells = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let ch = L.map[y][x] || " ";
      if (ch === "@") { px = x; py = y; ch = "."; }
      else if (ch === "e") { enemies.push({ x, y, dx: 1, dy: 0 }); ch = "."; }
      else if (ch === "v") { enemies.push({ x, y, dx: 0, dy: 1 }); ch = "."; }
      if (ch === "c" || ch === "C") cells++;
      if (PORTAL_CH.includes(ch)) (ports[ch] = ports[ch] || []).push(y * w + x);
      grid.push(ch);
    }
  }
  const portal = {};
  for (const k in ports) if (ports[k].length === 2) { portal[ports[k][0]] = ports[k][1]; portal[ports[k][1]] = ports[k][0]; }
  return { w, h, grid, px, py, keys: { r: 0, b: 0, y: 0 }, boots: { h: false, f: false }, wet: { h: false, f: false },
    cells, sliding: null, facing: [0, 1], dead: null, won: false, enemies, portal, used: null };
}

function cloneState(s) {
  return { ...s, grid: s.grid.slice(), keys: { ...s.keys }, boots: { ...s.boots }, wet: { ...s.wet },
    enemies: s.enemies.map(e => ({ ...e })) };
}

function tileAt(s, x, y) {
  if (x < 0 || y < 0 || x >= s.w || y >= s.h) return "#";
  return s.grid[y * s.w + x];
}
function setTile(s, x, y, c) { s.grid[y * s.w + x] = c; }

// Mutates s. Returns true if the player moved.
function tryMove(s, dx, dy) {
  s.facing = [dx, dy];
  s.used = null;
  const nx = s.px + dx, ny = s.py + dy;
  const t = tileAt(s, nx, ny);
  if (t === "#" || t === " ") return false;
  if (t === "R" || t === "B" || t === "Y") {
    const k = t.toLowerCase();
    if (s.keys[k] <= 0) return false;
    s.keys[k]--; setTile(s, nx, ny, ".");
  } else if (t === "S") {
    if (s.cells > 0) return false;
    setTile(s, nx, ny, ".");
  } else if (t === "x") {
    const bx = nx + dx, by = ny + dy, bt = tileAt(s, bx, by);
    if (s.enemies.some(e => e.x === bx && e.y === by)) return false;
    if (bt === "." || bt === ",") setTile(s, bx, by, "x");
    else if (bt === "w") setTile(s, bx, by, ",");
    else return false;
    setTile(s, nx, ny, ".");
  }
  s.px = nx; s.py = ny;
  const u = tileAt(s, nx, ny);
  s.sliding = null;
  if (u === "w") { if (!s.boots.h) s.dead = "You sank! You need swim fins to cross water."; else s.wet.h = true; }
  else if (u === "l") { if (!s.boots.f) s.dead = "Melted! You need fire boots to cross lava."; else s.wet.f = true; }
  else {
    // Back on solid ground: power-ups that were used are gone
    if (s.wet.h) { s.boots.h = false; s.wet.h = false; s.used = "h"; }
    if (s.wet.f) { s.boots.f = false; s.wet.f = false; s.used = s.used ? "hf" : "f"; }
    if (u === "c") { s.cells--; setTile(s, nx, ny, "."); }
    else if (u === "C") { s.cells--; setTile(s, nx, ny, "i"); s.sliding = [dx, dy]; }
    else if (u in KEYS) { s.keys[u]++; setTile(s, nx, ny, "."); }
    else if ((u === "h" || u === "f") && !s.boots[u]) { s.boots[u] = true; setTile(s, nx, ny, "."); }
    else if (u === "E") { s.won = true; }
    else if (u === "i") { s.sliding = [dx, dy]; }
    else if (u === "/" || u === "\\") { s.sliding = deflect(u, dx, dy); s.facing = s.sliding; }
    else if (PORTAL_CH.includes(u)) {
      const to = s.portal[ny * s.w + nx];
      if (to !== undefined) { s.px = to % s.w; s.py = Math.floor(to / s.w); s.teleported = true; }
    }
  }
  if (s.enemies.some(e => e.x === s.px && e.y === s.py)) s.dead = "Zapped by a drone!";
  return true;
}

// One slide step on ice. Returns true if still sliding.
function slideStep(s) {
  if (!s.sliding) return false;
  const [dx, dy] = s.sliding;
  if (!tryMove(s, dx, dy)) { s.sliding = null; return false; }
  return !!s.sliding;
}

function enemyPassable(s, x, y) {
  const t = tileAt(s, x, y);
  return (t === "." || t === ",") && !s.enemies.some(e => e.x === x && e.y === y);
}

function moveEnemies(s) {
  for (const e of s.enemies) {
    let nx = e.x + e.dx, ny = e.y + e.dy;
    if (!enemyPassable(s, nx, ny)) {
      e.dx = -e.dx; e.dy = -e.dy;
      nx = e.x + e.dx; ny = e.y + e.dy;
      if (!enemyPassable(s, nx, ny)) continue;
    }
    e.x = nx; e.y = ny;
    if (e.x === s.px && e.y === s.py) s.dead = "Zapped by a drone!";
  }
}

if (typeof module !== "undefined") module.exports = { LEVELS, loadLevel, loadLevelFrom, moveEnemies, cloneState, tryMove, slideStep, tileAt, deflect, PORTAL_CH };

// ===== Volt Runner procedural level generator (deterministic, seeded) =====
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const GEN_INTRO = {
  10: "From here on, maps are bigger than your screen. Tap MAP to peek at the whole level.",
  12: "Water barriers block the halls. Swim fins get you across once, so grab a fresh pair for the trip back.",
  14: "Drones now roam the rooms and halls. Keep your distance.",
  15: "Lava walls appear. Fire boots also last for one crossing only.",
  18: "Crate bridges: push the crate into the water from the near side. Push it wrong and you'll need to retry.",
  22: "Ice rooms! Cells out on the ice are grabbed as you slide over them.",
  26: "Flooded rooms: stick to the safe path and save your power-ups for the hallways.",
  30: "Rooms now have pillars. Watch for twisty routes.",
  50: "Halfway! Bigger maps, longer key chains, tighter clocks.",
  75: "The deep grid. Plan your route before you run.",
  100: "Level 100. Survive this and the Deep Grid awaits.",
  101: "Bumpers! The angled blocks on ice bounce you sideways mid-slide.",
  125: "Every crossing costs a power-up. Don't waste them on detours.",
  150: "Portals! Step on a colored portal to warp to its twin. Some rooms can only be reached this way.",
  175: "Portal mazes. Map out where each pair leads before you commit.",
  200: "Level 200, the final overload. Good luck, runner.",
};
const GEN_TIPS = [
  "Keys are often hidden deep in dead ends. Explore before you commit.",
  "The clock is tight. Plan the route on the MAP first.",
  "Every key works once, so open the doors that matter.",
  "Drones bounce back and forth. Wait for the gap.",
  "Power-ups are one crossing each. Spares wait for you on the other side.",
  "You can only carry one pair of fins and one pair of boots at a time.",
  "Bumpers on ice redirect you. Think two bounces ahead.",
];
const ADJ = ["Copper","Neon","Static","Rusty","Humming","Silent","Flux","Ion","Quartz","Cobalt","Magnetic","Phantom","Overclocked","Shorted","Molten","Frozen","Echo","Pulse","Hollow","Tangled","Grounded","Live","High-Voltage","Signal","Binary"];
const NOUN = ["Grid","Relay","Conduit","Vault","Junction","Circuit","Labyrinth","Reactor","Core","Array","Switchyard","Coil","Bus","Matrix","Furnace","Cistern","Foundry","Annex","Spire","Substation","Catacomb","Breaker","Capacitor","Network","Spiral"];

function genParams(L) {
  let P;
  if (L <= 100) {
    const t = (L - 10) / 90;
    P = { t, rooms: Math.round(5 + t * 20), n: t < 0.3 ? 5 : t < 0.65 ? 6 : 7, gateP: 0.35 + 0.5 * t,
      cells: 4 + Math.round(t * 18), drones: L >= 14 ? 1 + Math.floor(t * 10) : 0,
      special: Math.min(0.75, 0.25 + t * 0.6), timeF: 1.1 - 0.55 * t };
  } else {
    const u = (L - 100) / 100;
    P = { t: 1 + u, rooms: Math.round(25 + u * 11), n: 7, gateP: 0.85 + 0.1 * u,
      cells: 22 + Math.round(u * 12), drones: 11 + Math.floor(u * 8),
      special: 0.8, timeF: 0.55 - 0.12 * u };
  }
  P.Rc = Math.ceil(Math.sqrt(P.rooms)); P.Rr = Math.ceil(P.rooms / P.Rc);
  P.water = L >= 12; P.lava = L >= 15; P.crate = L >= 18; P.ice = L >= 22; P.hazard = L >= 26; P.maze = L >= 30;
  P.bumpers = L >= 101;
  P.portalEdgeP = L >= 150 ? 0.12 + 0.13 * (L - 150) / 50 : 0;
  P.shortcuts = L >= 150 ? 1 + Math.floor((L - 150) / 25) : 0;
  return P;
}

function generateLevel(L, seed) {
  const rng = mulberry32(seed * 7919 + L);
  const ri = n => Math.floor(rng() * n);
  const pick = a => a[ri(a.length)];
  const P = genParams(L);
  const { Rr, Rc, n } = P, st = n + 3;
  const W = Rc * st - 1, H = Rr * st - 1;
  const g = Array.from({ length: H }, () => Array(W).fill("#"));
  const rid = (i, j) => i * Rc + j;
  const N = Rr * Rc;
  const ox = j => 1 + j * st, oy = i => 1 + i * st;
  const rX = r => ox(r % Rc), rY = r => oy(Math.floor(r / Rc));

  // ---- spanning tree (randomized DFS with occasional branching) ----
  const corners = [0, Rc - 1, (Rr - 1) * Rc, N - 1];
  const start = pick(corners);
  const depth = Array(N).fill(0), seen = Array(N).fill(false);
  const edges = [];
  const stack = [start]; seen[start] = true;
  while (stack.length) {
    const idx = rng() < 0.2 ? ri(stack.length) : stack.length - 1;
    const r = stack[idx], i = Math.floor(r / Rc), j = r % Rc;
    const nb = [[i - 1, j], [i + 1, j], [i, j - 1], [i, j + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < Rr && b < Rc && !seen[rid(a, b)]);
    if (!nb.length) { stack.splice(idx, 1); continue; }
    const [a, b] = pick(nb), v = rid(a, b);
    seen[v] = true; depth[v] = depth[r] + 1; stack.push(v); edges.push([r, v]);
  }
  const children = Array.from({ length: N }, () => []);
  for (const [u, v] of edges) children[u].push(v);
  const bfs = [start];
  for (let k = 0; k < bfs.length; k++) bfs.push(...children[bfs[k]]);
  const parentOf = Array(N).fill(-1);
  for (const [u, v] of edges) parentOf[v] = u;
  let exit = start;
  for (let r = 0; r < N; r++) if (depth[r] > depth[exit]) exit = r;

  // ---- room types ----
  const type = Array(N).fill("plain");
  for (let r = 0; r < N; r++) {
    if (r === start || r === exit) continue;
    if (rng() < P.special) {
      const opts = [];
      if (P.ice) opts.push("ice", ...(P.bumpers ? ["ice"] : []));
      if (P.hazard) opts.push("water", "lava");
      if (P.maze) opts.push("maze", "maze");
      if (opts.length) type[r] = pick(opts);
    }
  }

  // ---- connections: corridors or portal links ----
  const reserved = Array.from({ length: N }, () => []);
  const corr = {}, portalEdge = {};
  let nextPortal = 0;
  const randomSpot = r => {
    const X = rX(r), Y = rY(r);
    if (type[r] === "ice") { // border ring only
      const side = ri(4), k = ri(n);
      return side === 0 ? [X + k, Y] : side === 1 ? [X + k, Y + n - 1] : side === 2 ? [X, Y + k] : [X + n - 1, Y + k];

    return [X + ri(n), Y + ri(n)];
  };
  const isRes = (r, x, y) => reserved[r].some(([a, b]) => a === x && b === y);
  for (const [u, v] of edges) {
    if (v !== exit && P.portalEdgeP && nextPortal < 3 && rng() < P.portalEdgeP) {
      const pu = randomSpot(u), pv = randomSpot(v);
      if (isRes(u, ...pu) || isRes(v, ...pv)) { /* fall through to a corridor */ }
      else { reserved[u].push(pu); reserved[v].push(pv); portalEdge[v] = { ch: "1234"[nextPortal++], pu, pv }; continue; }
    }
    const ui = Math.floor(u / Rc), uj = u % Rc, vi = Math.floor(v / Rc), vj = v % Rc;
    const k = ri(n);
    let tiles;
    if (ui === vi) {
      const y = oy(ui) + k, left = Math.min(uj, vj), x0 = ox(left) + n;
      tiles = [[x0, y], [x0 + 1, y], [x0 + 2, y]];
      if (uj > vj) tiles.reverse();
      reserved[u].push(uj < vj ? [x0 - 1, y] : [x0 + 3, y]);
      reserved[v].push(uj < vj ? [x0 + 3, y] : [x0 - 1, y]);
    } else {
      const x = ox(uj) + k, top = Math.min(ui, vi), y0 = oy(top) + n;
      tiles = [[x, y0], [x, y0 + 1], [x, y0 + 2]];
      if (ui > vi) tiles.reverse();
      reserved[u].push(ui < vi ? [x, y0 - 1] : [x, y0 + 3]);
      reserved[v].push(ui < vi ? [x, y0 + 3] : [x, y0 - 1]);
    }
    corr[v] = tiles;
  }

  // ---- carve rooms ----
  const cand = Array.from({ length: N }, () => []);   // floor tiles for items
  const iceCand = Array.from({ length: N }, () => []); // ice tiles cells can sit on

  // Checks an ice room: every slide ends somewhere you can get back from, no endless bumper loops.
  function iceAnalysis(X, Y) {
    const inR = (x, y) => x >= X && y >= Y && x < X + n && y < Y + n;
    const key = (x, y) => y * W + x;
    const stops = new Map(), trav = new Set(), q = [];
    for (let y = Y; y < Y + n; y++) for (let x = X; x < X + n; x++)
      if (g[y][x] === ".") { stops.set(key(x, y), []); q.push([x, y]); }
    const border = new Set(stops.keys());
    while (q.length) {
      const [sx, sy] = q.pop(), outs = stops.get(key(sx, sy));
      for (let [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
        let x = sx, y = sy, moved = false, steps = 0;
        for (;;) {
          const nx = x + dx, ny = y + dy;
          if (!inR(nx, ny) || g[ny][nx] === "#") break;
          x = nx; y = ny; moved = true;
          const t = g[y][x];
          if (t === ".") break;
          if (t === "i") trav.add(key(x, y));
          else if (t === "/" || t === "\\") [dx, dy] = deflect(t, dx, dy);
          if (++steps > 4 * n * n) return null; // bumper loop
        }
        if (!moved) continue;
        const k = key(x, y); outs.push(k);
        if (!stops.has(k)) { stops.set(k, []); q.push([x, y]); }
      }
    }
    // every stop must be able to get back to the floor ring
    const back = new Set(border);
    let grew = true;
    while (grew) { grew = false; for (const [k, outs] of stops) if (!back.has(k) && outs.some(o => back.has(o))) { back.add(k); grew = true; } }
    for (const k of stops.keys()) if (!back.has(k)) return null;
    return [...trav].map(k => [k % W, Math.floor(k / W)]);
  }

  function carveRoom(r) {
    const X = rX(r), Y = rY(r), T = type[r];
    const fill = c => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) g[Y + y][X + x] = c; };
    fill(".");
    if (T === "ice") {
      let trav = null;
      for (let attempt = 0; attempt < 14 && !trav; attempt++) {
        fill(".");
        for (let y = 1; y < n - 1; y++) for (let x = 1; x < n - 1; x++) g[Y + y][X + x] = "i";
        const pil = n >= 6 ? 1 + ri(2) : ri(2);
        for (let p = 0; p < pil; p++) g[Y + 1 + ri(n - 2)][X + 1 + ri(n - 2)] = "#";
        if (P.bumpers && attempt < 12) {
          const nb = n >= 7 ? 2 + ri(3) : 1 + ri(2);
          for (let b = 0; b < nb; b++) { const x = X + 1 + ri(n - 2), y = Y + 1 + ri(n - 2); if (g[y][x] === "i") g[y][x] = rng() < 0.5 ? "/" : "\\"; }
        }
        trav = iceAnalysis(X, Y);
      }
      if (!trav) return false;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
        if (g[Y + y][X + x] === "." && !isRes(r, X + x, Y + y)) cand[r].push([X + x, Y + y]);
      iceCand[r] = trav;
      return true;
    }
    if (T === "water" || T === "lava") {
      fill(T === "water" ? "w" : "l");
      const hub = [X + 1 + ri(n - 2), Y + 1 + ri(n - 2)];
      const carve = ([ax, ay], [bx, by]) => {
        let x = ax, y = ay; g[y][x] = ".";
        while (x !== bx || y !== by) {
          if (x !== bx && (y === by || rng() < 0.5)) x += Math.sign(bx - x); else y += Math.sign(by - y);

        }
      };
      for (const p of reserved[r]) carve(p, hub);
      if (!reserved[r].length) carve(hub, hub);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
        if (g[Y + y][X + x] === "." && !isRes(r, X + x, Y + y)) cand[r].push([X + x, Y + y]);
      return true;
    }
    for (let attempt = 0; attempt < 20; attempt++) {
      fill(".");
      if (T === "maze") {
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
          if (!isRes(r, X + x, Y + y) && rng() < 0.3) g[Y + y][X + x] = "#";
      }
      let s0 = reserved[r][0];
      if (!s0) { for (let y = 0; y < n && !s0; y++) for (let x = 0; x < n && !s0; x++) if (g[Y + y][X + x] === ".") s0 = [X + x, Y + y]; }
      if (!s0) continue;
      const vis = new Set([s0[0] + "," + s0[1]]), q = [s0];
      while (q.length) {
        const [x, y] = q.pop();
        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
          const a = x + dx, b = y + dy;
          if (a < X || b < Y || a >= X + n || b >= Y + n || g[b][a] === "#" || vis.has(a + "," + b)) continue;
          vis.add(a + "," + b); q.push([a, b]);
        }
      }
      if (!reserved[r].every(([a, b]) => vis.has(a + "," + b))) continue;
      for (const k of vis) { const [a, b] = k.split(",").map(Number); if (!isRes(r, a, b)) cand[r].push([a, b]); }

    }
    return false;
  }
  for (let r = 0; r < N; r++) if (!carveRoom(r)) return null;

  // floor tile (or, for cells, an ice tile) from a room
  const takeTile = (r, cellOK) => {
    const pool = cand[r].concat(cellOK ? iceCand[r].map(p => [...p, 1]) : []);
    for (let tries = 0; tries < 30 && pool.length; tries++) {
      const k = ri(pool.length), [x, y, ice] = pool[k];
      pool.splice(k, 1);

    }

  };
  const putIn = (r, ch) => {
    const p = takeTile(r, ch === "c");
    if (!p) return false;
    g[p[1]][p[0]] = p[2] === "i" ? "C" : ch;
    return true;
  };
  const place = (rooms, ch) => {
    for (let tries = 0; tries < 40; tries++) {
      let tot = 0; for (const r of rooms) tot += depth[r] + 1;
      let k = rng() * tot, r = rooms[0];
      for (const q of rooms) { k -= depth[q] + 1; if (k <= 0) { r = q; break; } }
      if (putIn(r, ch)) return true;
    }
    return false;
  };

  const sp = takeTile(start, false); if (!sp) return null; g[sp[1]][sp[0]] = "@";
  const ep = takeTile(exit, false); if (!ep) return null; g[ep[1]][ep[0]] = "E";

  // ---- gates (processed outward from the start) ----
  let gates = 0;
  const reach = [];
  for (const v of bfs) {
    if (v !== start) {
      const u = parentOf[v];
      if (portalEdge[v]) {
        const { ch, pu, pv } = portalEdge[v];
        g[pu[1]][pu[0]] = ch; g[pv[1]][pv[0]] = ch; gates++;
      } else {
        const tiles = corr[v];

        if (v === exit) { g[tiles[1][1]][tiles[1][0]] = "S"; }

          const opts = ["door", "door", "door"];
          if (P.water) opts.push("water");
          if (P.lava) opts.push("lava");
          if (P.crate) opts.push("crate", "crate");
          const k = pick(opts);
          if (k === "door") {

            if (!putIn(u, item) || !putIn(v, item)) return null;

            g[tiles[1][1]][tiles[1][0]] = "w";

  }

  for (let s = 0; s < P.shortcuts && nextPortal < 4; s++) {

    if (a === b) continue;
    const pa = takeTile(a, false), pb = takeTile(b, false);
    if (!pa || !pb) continue;
    const ch = "1234"[nextPortal++];
    g[pa[1]][pa[0]] = ch; g[pb[1]][pb[0]] = ch;
  }
  for (let c = 0; c < P.cells; c++) if (!place(reach, "c")) return null;
  const droneRooms = reach.filter(r => r !== start && (type[r] === "plain" || type[r] === "maze"));

    const r = pick(droneRooms), p = takeTile(r, false);
    if (p) g[p[1]][p[0]] = rng() < 0.5 ? "e" : "v";
  }
  const name = ADJ[L % 25] + " " + NOUN[(L * 3 + Math.floor(L / 25)) % 25];
  const hint = GEN_INTRO[L] || GEN_TIPS[L % GEN_TIPS.length];
  return { name, hint, map: g.map(r => r.join("")), gates };
}

// Greedy verifier: walks to the nearest pickup; if none, through the nearest gate or hazard crossing.
// Every move is replayed with the real game rules, so a level it finishes is truly beatable.
function verifyLevel(lv) {
  const s = loadLevelFrom(lv); s.enemies = [];
  const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  const T = (x, y) => tileAt(s, x, y);
  function sim(x, y, wh, wf, dx, dy, allow) {
    let first = true;
    for (;;) {
      const nx = x + dx, ny = y + dy, t = T(nx, ny);
      const stop = first ? null : { x, y, wh: false, wf: false, ev: 0 };
      if (t === "#" || t === " ") return stop;
      if (t === "R" || t === "B" || t === "Y") return allow && s.keys[t.toLowerCase()] > 0 ? { x: nx, y: ny, ev: 2 } : stop;
      if (t === "S") return allow && s.cells === 0 ? { x: nx, y: ny, ev: 2 } : stop;
      if (t === "x") { const bt = T(nx + dx, ny + dy); return allow && (bt === "." || bt === "," || bt === "w") ? { x: nx, y: ny, ev: 2 } : stop; }
      if (t === "w") return allow && s.boots.h ? { x: nx, y: ny, wh: true, wf, ev: 0 } : null;
      if (t === "l") return allow && s.boots.f ? { x: nx, y: ny, wh, wf: true, ev: 0 } : null;
      if (wh || wf) return { x: nx, y: ny, ev: 3 };
      if ("crybEC".includes(t) || (t === "h" && !s.boots.h) || (t === "f" && !s.boots.f)) return { x: nx, y: ny, ev: 1 };
      if (PORTAL_CH.includes(t)) { const to = s.portal[ny * s.w + nx]; if (to !== undefined) return { x: to % s.w, y: Math.floor(to / s.w), ev: 0 }; return { x: nx, y: ny, ev: 0 }; }
      if (t === "i") { x = nx; y = ny; first = false; continue; }
      if (t === "/" || t === "\\") { [dx, dy] = deflect(t, dx, dy); x = nx; y = ny; first = false; continue; }
      return { x: nx, y: ny, ev: 0 };
    }
  }
  const everSeen = new Set();
  function search(allow, reach1, mode) {
    const key = (x, y, wh, wf) => ((y * s.w + x) << 2) | (wh ? 2 : 0) | (wf ? 1 : 0);
    const k0 = key(s.px, s.py, s.wet.h, s.wet.f);
    const prev = new Map([[k0, null]]);
    const q = [[s.px, s.py, s.wet.h, s.wet.f]];
    const visited = new Set();
    for (let i = 0; i < q.length; i++) {
      const [x, y, wh, wf] = q[i], kk = key(x, y, wh, wf);
      if (!wh && !wf) visited.add(y * s.w + x);
      for (let d = 0; d < 4; d++) {
        const r = sim(x, y, wh, wf, DIRS[d][0], DIRS[d][1], allow);
        if (!r) continue;
        if (r.ev === 3) {
          const at = r.y * s.w + r.x;
          if (reach1 && reach1.has(at)) continue;                 // pointless dip
          if (mode === 2 && everSeen.has(at)) continue;           // save crossings for new ground first
        }
        if (r.ev) {
          const path = [d]; let c = kk;
          while (prev.get(c)) { path.push(prev.get(c)[1]); c = prev.get(c)[0]; }
          return { path: path.reverse() };
        }
        const nk = key(r.x, r.y, r.wh, r.wf);
        if (prev.has(nk)) continue;
        prev.set(nk, [kk, d]); q.push([r.x, r.y, !!r.wh, !!r.wf]);
      }
    }
    return { path: null, visited };
  }
  let steps = 0;
  for (let it = 0; it < 4000; it++) {
    if (s.won) return steps;
    const a = search(false, null, 1);
    for (const v of a.visited || []) everSeen.add(v);
    const path = a.path || search(true, a.visited, 2).path || search(true, a.visited, 3).path;
    if (!path) return -1;
    for (const d of path) {
      if (!tryMove(s, DIRS[d][0], DIRS[d][1])) return -1;
      steps++;
      if (!s.wet.h && !s.wet.f) everSeen.add(s.py * s.w + s.px);
      let g = 0; while (s.sliding && !s.dead && !s.won && g++ < 300) { slideStep(s); steps += 0.5; }
      if (s.dead || (s.sliding && !s.won)) return -1;
      if (s.won) return steps;
    }
  }
  return -1;
}
