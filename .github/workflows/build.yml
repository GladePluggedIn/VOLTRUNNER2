# Builds Volt Runner on GitHub's servers every time you push.
# Results appear under Actions > (latest run) > Artifacts:
#   volt-runner-test-apk  -> install directly on your phone
#   volt-runner-play-aab  -> upload to Google Play (only when signing secrets are set)
name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: volt-runner-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build and sign Play Store bundle
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          jarsigner -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            app/build/outputs/bundle/release/app-release.aab upload
          rm upload.jks

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: volt-runner-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
